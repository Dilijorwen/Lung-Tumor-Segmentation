data:
  data_dir: ../preprocessed_npy
  img_size: 512
  validate_files: true

output:
  output_dir: ../outputs
  run_name: null
  run_type: auto

model:
  name: UNet2D
  in_channels: 1
  out_channels: 1
  base_channels: 32
  bilinear: false
  sync_batchnorm: false

loss:
  name: BCEWithLogitsLoss + DiceLoss
  bce_weight: 1.0
  dice_weight: 1.0
  dice_smooth: 1.0
  pos_weight: null

training:
  epochs: 100
  batch_size_per_gpu: 8
  learning_rate: 0.0001
  weight_decay: 0.00001
  optimizer: AdamW
  scheduler: cosine
  min_learning_rate: 0.000001
  num_workers: 8
  seed: 42
  mixed_precision: true
  grad_clip_norm: 0.0
  resume: null

metrics:
  threshold: 0.5

ddp:
  backend: nccl
