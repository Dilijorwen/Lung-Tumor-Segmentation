data:
  data_dir: ../preprocessed_npy
  img_size: 512
  validate_files: true

output:
  output_dir: ../outputs
  run_name: null
  run_type: auto

model:
  name: SMPUnetPlusPlus
  architecture: unet++
  library: segmentation_models_pytorch
  encoder_name: resnet34
  encoder_weights: null
  encoder_depth: 5
  in_channels: 1
  out_channels: 1
  decoder_channels:
    - 256
    - 128
    - 64
    - 32
    - 16
  decoder_use_batchnorm: true
  decoder_attention_type: null
  sync_batchnorm: false

loss:
  name: BCEWithLogitsLoss + DiceLoss + FocalTverskyLoss
  bce_weight: 1.0
  dice_weight: 1.0
  dice_smooth: 1.0
  tversky_weight: 0.0
  focal_tversky_weight: 0.5
  tversky_alpha: 0.3
  tversky_beta: 0.7
  focal_tversky_gamma: 0.75
  pos_weight: null
  auto_pos_weight: true
  pos_weight_max: 20.0
  pos_weight_min: 1.0

sampling:
  balanced_train: true
  positive_fraction: 0.5
  samples_per_epoch: null

augmentation:
  enabled: true
  horizontal_flip_p: 0.5
  vertical_flip_p: 0.0
  rotate90_p: 0.0
  intensity_scale: 0.10
  intensity_shift: 0.05
  gaussian_noise_std: 0.01
  clip_image: true

training:
  epochs: 100
  batch_size_per_gpu: 8
  learning_rate: 0.0001
  weight_decay: 0.00001
  optimizer: AdamW
  scheduler: cosine
  min_learning_rate: 0.000001
  num_workers: 8
  seed: 42
  mixed_precision: true
  grad_clip_norm: 0.0
  resume: null

metrics:
  threshold: 0.5
  threshold_candidates:
    - 0.05
    - 0.10
    - 0.15
    - 0.20
    - 0.25
    - 0.30
    - 0.35
    - 0.40
    - 0.45
    - 0.50
    - 0.55
    - 0.60
    - 0.65
    - 0.70
    - 0.75
    - 0.80
    - 0.85
    - 0.90

ddp:
  backend: nccl
  find_unused_parameters: false
