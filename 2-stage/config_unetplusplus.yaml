data:
  data_dir: ../prepared_npy
  img_size: 512
  validate_files: true

output:
  output_dir: ../outputs
  run_name: null
  run_type: auto

model:
  name: SMPUnetPlusPlus
  architecture: unet++
  library: segmentation_models_pytorch
  encoder_name: resnet34
  encoder_weights: null
  encoder_depth: 5
  in_channels: 1
  out_channels: 1
  decoder_channels:
    - 256
    - 128
    - 64
    - 32
    - 16
  decoder_use_batchnorm: true
  decoder_attention_type: null
  sync_batchnorm: false

loss:
  name: BCEWithLogitsLoss + DiceLoss + FocalTverskyLoss
  bce_weight: 1.0
  dice_weight: 1.0
  dice_smooth: 1.0
  tversky_weight: 0.0
  focal_tversky_weight: 0.5
  tversky_alpha: 0.3
  tversky_beta: 0.7
  focal_tversky_gamma: 0.75
  pos_weight: null
  auto_pos_weight: true
  pos_weight_max: 20.0
  pos_weight_min: 1.0

train:
  img_size: 256

val:
  img_size: 512

test:
  img_size: 512

training:
  epochs: 100
  batch_size_per_gpu: 8
  learning_rate: 0.0001
  weight_decay: 0.00001
  optimizer: AdamW
  scheduler: cosine
  min_learning_rate: 0.000001
  num_workers: 8
  seed: 2004
  mixed_precision: true
  grad_clip_norm: 0.0
  resume: null

early_stopping:
  enabled: true
  monitor: val_best_dice
  mode: max
  patience: 20
  min_delta: 0.001
  min_epochs: 30

metrics:
  threshold: 0.5
  threshold_candidates:
    - 0.025
    - 0.050
    - 0.075
    - 0.100
    - 0.125
    - 0.150
    - 0.175
    - 0.200
    - 0.225
    - 0.250
    - 0.275
    - 0.300
    - 0.325
    - 0.350
    - 0.375
    - 0.400
    - 0.425
    - 0.450
    - 0.475
    - 0.500
    - 0.525
    - 0.550
    - 0.575
    - 0.600
    - 0.625
    - 0.650
    - 0.675
    - 0.700
    - 0.725
    - 0.750
    - 0.775
    - 0.800
    - 0.825
    - 0.850
    - 0.875
    - 0.900
    - 0.925
    - 0.950
    - 0.975

ddp:
  backend: nccl
  find_unused_parameters: false
